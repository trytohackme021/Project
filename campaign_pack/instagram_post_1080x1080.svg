<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Decorative circles / ambient lighting -->
  <circle cx="950" cy="180" r="280" fill="#2563eb" opacity="0.18" filter="url(#glow)" />
  <circle cx="120" cy="900" r="320" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="360" height="44" rx="22" fill="#2563eb" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2" />
    <text x="180" y="28" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">RIMS CENTRAL LIBRARY</text>
  </g>

  <!-- Sub-badge -->
  <text x="80" y="175" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="3">CAMPUS REVIVAL 2026</text>

  <!-- Big Headline -->
  <text x="80" y="260" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">NO MORE</text>
  <text x="80" y="340" fill="url(#accentGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">5 PM CURFEW.</text>

  <!-- Main Subtitle -->
  <text x="80" y="405" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400">
    Your classes end late. Now your library stays open even later.
  </text>

  <!-- Data Stat Card from Analysis -->
  <g transform="translate(80, 460)">
    <rect width="920" height="200" rx="20" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" />
    <!-- Stat accent circle -->
    <rect x="35" y="35" width="130" height="130" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <text x="100" y="105" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle">60%</text>
    <text x="100" y="135" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DROP OFF</text>
    
    <!-- Stat Text -->
    <text x="195" y="75" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">AUDIT DATA INSIGHT:</text>
    <text x="195" y="112" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Visits plunged by 60% after 3 PM because labs run till 4:30 PM.
    </text>
    <text x="195" y="148" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">
      ➔ Solution: Doors now unlocked until 8:30 PM every weekday!
    </text>
  </g>

  <!-- Feature Highlights -->
  <g transform="translate(80, 710)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="25" y="50" font-size="32">📚</text>
      <text x="25" y="90" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">2024 Course Reserve</text>
      <text x="25" y="120" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Latest syllabus editions</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(320, 0)">
      <rect width="280" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="25" y="50" font-size="32">⚡</text>
      <text x="25" y="90" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">Power At Every Desk</text>
      <text x="25" y="120" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">High-speed gigabit Wi-Fi</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(640, 0)">
      <rect width="280" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="25" y="50" font-size="32">👥</text>
      <text x="25" y="90" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">Group Collab Zone</text>
      <text x="25" y="120" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Whiteboards &amp; discussion</text>
    </g>
  </g>

  <!-- CTA Bar -->
  <g transform="translate(80, 910)">
    <rect width="920" height="90" rx="45" fill="url(#accentGrad)" />
    <text x="460" y="55" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1">
      CLAIM YOUR EVENING STUDY DESK ➔ MON–FRI 8:30 AM TO 8:30 PM
    </text>
  </g>
</svg>
